# --------------------------------------------------------------------------
# AI 时代的软件工程：从敏捷开发到氛围编程
# --------------------------------------------------------------------------
# Sphinx build toolchain for the book. Not a distributable package — the
# `package-mode = false` flag keeps `poetry install` fast and avoids any
# wheel-build attempt.
#
# Quick start:
#
#     make install     # poetry install (creates ./.venv)
#     make html        # sphinx-build (strict)
#     make serve       # serve build/html/ at http://localhost:7800
#     make livehtml    # live-reload preview
#     make publish     # build + force-push build/html/ to gh-pages branch
# --------------------------------------------------------------------------

[project]
name = "walter-ai-engineering-book"
version = "1.0.0"
description = "Sphinx build toolchain for 'AI 时代的软件工程：从敏捷开发到氛围编程'"
license = "CC-BY-NC-SA-4.0"
readme = "README.md"
authors = [{ name = "Walter Fan" }]
requires-python = ">=3.11,<4.0"
# Lower bounds match the prior requirements.txt; the compatible-release
# cap (~=) prevents silent major-version jumps.
dependencies = [
    "Sphinx (>=8.1,<9.0)",
    "myst-parser (>=4.0,<5.0)",
    "sphinx-book-theme (>=1.1,<2.0)",
    "sphinx-copybutton (>=0.5,<0.6)",
    "sphinxcontrib-mermaid (>=1.0,<2.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
sphinx-autobuild = "~=2024.10"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
